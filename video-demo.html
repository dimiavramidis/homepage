<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>AIONIO | Video Demo</title>
    <meta
      name="description"
      content="Private demo page for the AIONIO homepage video."
    />
    <meta name="robots" content="noindex,nofollow,noarchive" />

    <link rel="shortcut icon" href="assets/images/AIONIO_LOGO.svg" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        color-scheme: dark;
        --bg: #071018;
        --panel: rgba(10, 20, 31, 0.82);
        --panel-border: rgba(255, 255, 255, 0.12);
        --text: #f3f7fb;
        --muted: #b2c0cc;
        --accent: #77d7ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: "Inter", Arial, sans-serif;
        background:
          radial-gradient(circle at top, rgba(119, 215, 255, 0.2), transparent 34%),
          linear-gradient(160deg, #050b11 0%, #081522 42%, #050b11 100%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .shell {
        width: min(1100px, 100%);
        padding: 28px;
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        background: var(--panel);
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 12px;
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 3rem);
        line-height: 1.05;
      }

      .description {
        margin: 14px 0 0;
        max-width: 60ch;
        color: var(--muted);
        line-height: 1.6;
      }

      .video-frame {
        margin-top: 24px;
        border-radius: 22px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #000;
        aspect-ratio: 16 / 9;
      }

      video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: #000;
      }

      .hint {
        margin: 16px 0 0;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .hint strong {
        color: var(--text);
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <main class="shell">
      <p class="eyebrow">Demo Video</p>
      <h1>AIONIO AI Assistant</h1>
      <p class="description">
        Private, integrated, data-driven and under your control. 
      </p>

      <div class="video-frame">
        <video
          controls
          autoplay
          muted
          playsinline
          loop
          preload="metadata"
        >
          <source
            src="https://dimi-dev.s3.amazonaws.com/aionio/homepage/DemoVideoAIAssistant.mp4"
            type="video/mp4"
          />
          Your browser does not support the video tag.
        </video>
      </div>

      <p class="hint">
        <!-- If playback is blocked by browser policy, use the controls to start the
        video. -->
      </p>
    </main>
  </body>
</html>
